name: Flight Status Check

on:
  schedule:
    # Run every 5 minutes (Fastest allowed)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  check_flight:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Run Flight Tracker
      env:
        AIRLABS_API_KEY: ${{ secrets.AIRLABS_API_KEY }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FLIGHT_NUMBER: ${{ vars.FLIGHT_NUMBER || 'AA100' }} # Use var or default
      run: python main.py

    - name: Commit and Push Data
      run: |
        git config --global user.name 'Flight Tracker Bot'
        git config --global user.email 'bot@noreply.github.com'
        git add data.json
        git commit -m "Update flight subscriptions" || exit 0
        git push
